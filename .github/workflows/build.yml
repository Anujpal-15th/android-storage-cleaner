name: Build

# Every push: compile, unit tests and a signed APK artifact. A "v*" tag also publishes a GitHub Release.
# Checking a run: the summary on the run page shows a table plus every error with its file:line,
# errors are annotated on the code, and `gh run view <id>` prints the same annotations in a terminal.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency: # a newer push cancels the older run on the same branch
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash # -eo pipefail: a failing gradle fails the step even through `| tee`

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE: gradle --console=plain --warning-mode=summary

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile
        run: $GRADLE compileReleaseKotlin compileDebugUnitTestKotlin 2>&1 | tee -a build.log

      - name: Unit tests
        run: $GRADLE testDebugUnitTest 2>&1 | tee -a build.log

      - name: Release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          $GRADLE assembleRelease 2>&1 | tee -a build.log
          cp app/build/outputs/apk/release/app-release.apk "StorageCleaner-${GITHUB_REF_NAME//\//-}.apk"

      - name: Report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/ci-report.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: StorageCleaner-*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            build.log
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" StorageCleaner-*.apk --title "Storage Cleaner $GITHUB_REF_NAME" --notes-file .github/release-notes.md
